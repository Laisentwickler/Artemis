<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Artemis II Tracker</title>

<style>
  body { margin:0; overflow:hidden; background:black; font-family:Arial;}
  #ui {
    position:absolute;
    top:15px;
    left:15px;
    color:white;
    background:rgba(0,0,0,0.5);
    padding:12px;
    border-radius:10px;
  }
</style>
</head>

<body>

<div id="ui">
  <h3>🚀 Artemis II Tracker</h3>
  <p>Status: Simulation (Realdaten upgrade möglich)</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.152/examples/js/controls/OrbitControls.js"></script>

<script>
// Szene
const scene = new THREE.Scene();

// Kamera
const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0,2,5);

// Renderer
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Controls
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// Licht
const light = new THREE.PointLight(0xffffff, 2);
light.position.set(5,3,5);
scene.add(light);

// 🌌 Sterne
const starGeometry = new THREE.BufferGeometry();
const starCount = 10000;
const starPositions = [];

for(let i=0;i<starCount;i++){
  starPositions.push((Math.random()-0.5)*200);
  starPositions.push((Math.random()-0.5)*200);
  starPositions.push((Math.random()-0.5)*200);
}

starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starPositions,3));
const starMaterial = new THREE.PointsMaterial({size:0.2});
const stars = new THREE.Points(starGeometry, starMaterial);
scene.add(stars);

// 🌍 Erde
const earthTexture = new THREE.TextureLoader().load(
  "https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg"
);
const earth = new THREE.Mesh(
  new THREE.SphereGeometry(1,64,64),
  new THREE.MeshStandardMaterial({map:earthTexture})
);
scene.add(earth);

// 🌕 Mond
const moon = new THREE.Mesh(
  new THREE.SphereGeometry(0.27,32,32),
  new THREE.MeshStandardMaterial({color:0xaaaaaa})
);
scene.add(moon);

// 🚀 Artemis
const ship = new THREE.Mesh(
  new THREE.SphereGeometry(0.05,16,16),
  new THREE.MeshBasicMaterial({color:0xff0000})
);
scene.add(ship);

// 🔵 Flugbahn Linie
const pathPoints = [];
const pathGeometry = new THREE.BufferGeometry();
const pathMaterial = new THREE.LineBasicMaterial({color:0x00ffff});
const pathLine = new THREE.Line(pathGeometry, pathMaterial);
scene.add(pathLine);

// Animation Variablen
let angle = 0;

function animate(){
  requestAnimationFrame(animate);

  angle += 0.002;

  // 🚀 elliptische Bahn (realistischer)
  const x = Math.cos(angle)*2.5;
  const z = Math.sin(angle)*1.5;

  ship.position.set(x,0,z);

  // Mond Bewegung
  moon.position.set(Math.cos(angle*0.5)*4,0,Math.sin(angle*0.5)*4);

  // Erde Rotation
  earth.rotation.y += 0.0005;

  // Flugbahn erweitern
  pathPoints.push(ship.position.clone());
  if(pathPoints.length > 500) pathPoints.shift();

  pathGeometry.setFromPoints(pathPoints);

  controls.update();
  renderer.render(scene, camera);
}

animate();

// Resize
window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
